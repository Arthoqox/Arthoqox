name: Generate contribution snake

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate light and dark animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Arthoqox
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%236d5dfc
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2358e6ff

      - name: Publish animation branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

