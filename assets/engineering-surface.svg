<svg width="1000" height="540" viewBox="0 0 1000 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Arthoqox engineering surface</title>
  <desc id="desc">Four responsive interface cards presenting software engineering, offensive security, open source and design engineering capabilities.</desc>
  <defs>
    <linearGradient id="top" x1="24" y1="0" x2="976" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#9B87FF"/><stop offset=".5" stop-color="#43E6B5"/><stop offset="1" stop-color="#5BC8FF"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" stroke="#94A3B8" stroke-opacity=".035"/></pattern>
    <style>
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}.eyebrow{font-size:9px;letter-spacing:1.35px;fill:#6E7786}.heading{font-size:16px;font-weight:700;fill:#F1F5F9}.body{font-size:12px;fill:#A8B0BC}.key{font-size:10px;letter-spacing:.7px}.pulse{animation:p 2.2s ease-in-out infinite}@keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>
  <rect x=".5" y=".5" width="999" height="539" rx="15" fill="#080B10" stroke="#282E38"/><rect x="1" y="1" width="998" height="538" rx="14" fill="url(#grid)"/>
  <rect x="24" y="49" width="952" height="2" rx="1" fill="url(#top)"/>
  <text x="24" y="30" class="m eyebrow">ARTHOQOX / MULTIDISCIPLINARY ENGINEERING SURFACE</text><circle cx="950" cy="27" r="4" fill="#43E6B5" class="pulse"/><text x="904" y="31" class="m" font-size="9" fill="#43E6B5">LOADED</text>

  <g transform="translate(24 72)">
    <rect width="464" height="207" rx="11" fill="#0F131A" stroke="#303744"/>
    <rect x="16" y="17" width="27" height="22" rx="5" fill="#5BC8FF" fill-opacity=".1"/><text x="24" y="32" class="m" font-size="10" fill="#5BC8FF">01</text>
    <text x="55" y="33" class="m heading">SOFTWARE ENGINEERING</text><text x="330" y="31" class="m eyebrow">CORE SYSTEM</text>
    <path d="M16 53H448" stroke="#282F3A"/>
    <text x="18" y="78" class="m key" fill="#5BC8FF">LANGUAGES</text><text x="128" y="78" class="m body">Python · TypeScript · JavaScript · Go</text>
    <text x="18" y="104" class="m key" fill="#5BC8FF">BACKEND</text><text x="128" y="104" class="m body">APIs · async systems · automation</text>
    <text x="18" y="130" class="m key" fill="#5BC8FF">FRONTEND</text><text x="128" y="130" class="m body">React · components · responsive web</text>
    <text x="18" y="156" class="m key" fill="#5BC8FF">PLATFORM</text><text x="128" y="156" class="m body">Linux · Docker · Git · CI/CD</text>
    <rect x="18" y="178" width="85" height="15" rx="7.5" fill="#5BC8FF" fill-opacity=".08"/><text x="29" y="189" class="m" font-size="8" fill="#5BC8FF">BUILD / SHIP</text>
  </g>

  <g transform="translate(512 72)">
    <rect width="464" height="207" rx="11" fill="#0F131A" stroke="#3B3150"/>
    <rect x="16" y="17" width="27" height="22" rx="5" fill="#9B87FF" fill-opacity=".1"/><text x="24" y="32" class="m" font-size="10" fill="#9B87FF">02</text>
    <text x="55" y="33" class="m heading">OFFENSIVE SECURITY</text><text x="339" y="31" class="m eyebrow">RED TEAM</text>
    <path d="M16 53H448" stroke="#282F3A"/>
    <text x="18" y="78" class="m key" fill="#9B87FF">ROLE</text><text x="128" y="78" class="m body">Pentester · security researcher</text>
    <text x="18" y="104" class="m key" fill="#9B87FF">METHOD</text><text x="128" y="104" class="m body">Recon · enumerate · validate · report</text>
    <text x="18" y="130" class="m key" fill="#9B87FF">WEB</text><text x="128" y="130" class="m body">OWASP · auth flows · API security</text>
    <text x="18" y="156" class="m key" fill="#9B87FF">TOOLING</text><text x="128" y="156" class="m body">Burp · Nmap · Wireshark · Python</text>
    <rect x="18" y="178" width="93" height="15" rx="7.5" fill="#9B87FF" fill-opacity=".08"/><text x="29" y="189" class="m" font-size="8" fill="#9B87FF">TEST / VERIFY</text>
  </g>

  <g transform="translate(24 303)">
    <rect width="464" height="207" rx="11" fill="#0F131A" stroke="#28473F"/>
    <rect x="16" y="17" width="27" height="22" rx="5" fill="#43E6B5" fill-opacity=".1"/><text x="24" y="32" class="m" font-size="10" fill="#43E6B5">03</text>
    <text x="55" y="33" class="m heading">OPEN SOURCE</text><text x="343" y="31" class="m eyebrow">PUBLIC MODE</text>
    <path d="M16 53H448" stroke="#282F3A"/>
    <text x="18" y="78" class="m key" fill="#43E6B5">FOCUS</text><text x="128" y="78" class="m body">Tools that solve real problems</text>
    <text x="18" y="104" class="m key" fill="#43E6B5">CRAFT</text><text x="128" y="104" class="m body">Clean APIs · useful defaults · docs</text>
    <text x="18" y="130" class="m key" fill="#43E6B5">WORKFLOW</text><text x="128" y="130" class="m body">Issues · reviews · releases</text>
    <text x="18" y="156" class="m key" fill="#43E6B5">VALUES</text><text x="128" y="156" class="m body">Transparency · iteration · sharing</text>
    <rect x="18" y="178" width="103" height="15" rx="7.5" fill="#43E6B5" fill-opacity=".08"/><text x="29" y="189" class="m" font-size="8" fill="#43E6B5">CREATE / SHARE</text>
  </g>

  <g transform="translate(512 303)">
    <rect width="464" height="207" rx="11" fill="#0F131A" stroke="#3F3C2D"/>
    <rect x="16" y="17" width="27" height="22" rx="5" fill="#F6D365" fill-opacity=".1"/><text x="24" y="32" class="m" font-size="10" fill="#F6D365">04</text>
    <text x="55" y="33" class="m heading">WEB DESIGN &amp; UX</text><text x="342" y="31" class="m eyebrow">HUMAN LAYER</text>
    <path d="M16 53H448" stroke="#282F3A"/>
    <text x="18" y="78" class="m key" fill="#F6D365">DESIGN</text><text x="128" y="78" class="m body">UI systems · hierarchy · typography</text>
    <text x="18" y="104" class="m key" fill="#F6D365">UX</text><text x="128" y="104" class="m body">Flows · interaction · architecture</text>
    <text x="18" y="130" class="m key" fill="#F6D365">QUALITY</text><text x="128" y="130" class="m body">Responsive · accessible · fast</text>
    <text x="18" y="156" class="m key" fill="#F6D365">TOOLING</text><text x="128" y="156" class="m body">Figma · tokens · prototypes</text>
    <rect x="18" y="178" width="106" height="15" rx="7.5" fill="#F6D365" fill-opacity=".08"/><text x="29" y="189" class="m" font-size="8" fill="#F6D365">DESIGN / REFINE</text>
  </g>
</svg>
